name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 1. backend 폴더 안의 gradlew 파일에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # 2. working-directory를 backend로 지정하여 빌드 돌리기
      - name: Build with Gradle
        run: ./gradlew bootJar -x test
        working-directory: backend

      # 3. backend/build/libs/ 하위의 JAR 파일을 복사
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "backend/build/libs/ecommerce-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/db-project-e-commerce"
          strip_components: 3

      # 4. EC2에서 리눅스 환경변수 등록 후 스프링 부트 실행 (들여쓰기 수정 완료)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/db-project-e-commerce
            
            # 기존 서버 확실하게 죽이기
            sudo fuser -k 8080/tcp || true
            
            # 1. 리눅스 환경 변수로 먼저 등록
            export RDS_ENDPOINT="${{ secrets.DB_ENDPOINT }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export APP_CORS_ALLOWED_ORIGINS="https://db-project-e-commerce.vercel.app"
            
            # 2. 스프링 부트 백그라운드 실행
            nohup java -Dfile.encoding=UTF-8 -jar ecommerce-0.0.1-SNAPSHOT.jar > /home/ubuntu/app.log 2>&1 &
