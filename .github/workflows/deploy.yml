name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # 1. backend 폴더 안의 gradlew 파일에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      # 2. working-directory를 backend로 지정하여 빌드 돌리기
      - name: Build with Gradle
        run: ./gradlew bootJar -x test
        working-directory: backend

      # 3. backend/build/libs/ 하위의 JAR 파일을 복사 (경로 depth가 하나 늘어났으므로 strip_components: 3)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "backend/build/libs/ecommerce-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/db-project-e-commerce"
          strip_components: 3 # backend, build, libs 총 3개의 경로 껍질을 벗기고 JAR 파일만 복사

      # 4. EC2에서 서버 재구동 (이 부분은 이전과 동일하게 파일명 기준으로 작동)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/db-project-e-commerce
            
            sudo fuser -k 8080/tcp || true
            
            nohup java -Dfile.encoding=UTF-8 \
              -DRDS_ENDPOINT=${{ secrets.RDS_ENDPOINT }} \
              -DDB_USERNAME=${{ secrets.DB_USERNAME }} \
              -DDB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -DAPP_CORS_ALLOWED_ORIGINS=https://db-project-e-commerce.vercel.app \
              -jar ecommerce-0.0.1-SNAPSHOT.jar \
              > /home/ubuntu/app.log 2>&1 &
