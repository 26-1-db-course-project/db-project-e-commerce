name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/ecommerce-0.0.1-SNAPSHOT.jar"
          target: "/home/ubuntu/db-project-e-commerce"
          strip_components: 2 

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/db-project-e-commerce
            
            sudo fuser -k 8080/tcp || true
            
            nohup java -Dfile.encoding=UTF-8 \
              -DDB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -DDB_USERNAME=${{ secrets.DB_USERNAME }} \
              -DDB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -DAPP_CORS_ALLOWED_ORIGINS=https://db-project-e-commerce.vercel.app \
              -jar ecommerce-0.0.1-SNAPSHOT.jar \
              > /home/ubuntu/app.log 2>&1 &
