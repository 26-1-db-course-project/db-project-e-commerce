- name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/db-project-e-commerce
            
            # 기존 서버 확실하게 죽이기
            sudo fuser -k 8080/tcp || true
            
            # 1. 리눅스 환경 변수로 먼저 등록 (가장 확실하고 안전한 방법)
            export RDS_ENDPOINT="${{ secrets.DB_ENDPOINT }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export APP_CORS_ALLOWED_ORIGINS="https://db-project-e-commerce.vercel.app"
            
            # 2. 스프링 부트 백그라운드 실행
            nohup java -Dfile.encoding=UTF-8 -jar ecommerce-0.0.1-SNAPSHOT.jar > /home/ubuntu/app.log 2>&1 &
