spring:
  profiles:
    active: local
  application:
    name: backend

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
    properties:
      show_sql: true
      format_sql: true
      highlight_sql: true

# CORS 허용 출처 (프론트엔드 주소).
# 개발: Vite 개발 서버. 운영(AWS)에서는 환경변수로 덮어쓴다.
#   예) APP_CORS_ALLOWED_ORIGINS=https://내앱.vercel.app,https://*.vercel.app
app:
  cors:
    allowed-origins: http://localhost:5173